<svg xmlns="http://www.w3.org/2000/svg" width="296" height="52" viewBox="0 0 296 52" role="img" aria-labelledby="title">
  <title id="title">Connect with Ali Ebrahimi on LinkedIn</title>

  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="296" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E1B30"/>
      <stop offset="1" stop-color="#07111F"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="btn"><rect x="1" y="1" width="294" height="50" rx="13"/></clipPath>
  </defs>

  <style><![CDATA[
    .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
    .sweep{animation:sweep 4.8s ease-in-out 1.2s infinite backwards}
    .nudge{animation:nudge 1.9s ease-in-out infinite}
    @keyframes sweep{0%{transform:translateX(-90px) skewX(-18deg)}45%,100%{transform:translateX(380px) skewX(-18deg)}}
    @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.sweep{display:none}}
  ]]></style>

  <rect x="1" y="1" width="294" height="50" rx="13" fill="url(#fill)" stroke="url(#edge)" stroke-width="1.5"/>
  <g clip-path="url(#btn)"><rect class="sweep" x="0" y="0" width="70" height="52" fill="url(#sheen)"/></g>

  <rect x="22" y="13" width="26" height="26" rx="6" fill="#0A66C2"/>
  <text class="sans" x="35" y="31.5" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="800">in</text>

  <text class="mono" x="62" y="30.5" fill="#E2E8F0" font-size="12.5" font-weight="700" letter-spacing="1.6" textLength="176" lengthAdjust="spacing">CONNECT ON LINKEDIN</text>

  <g transform="translate(260 26)">
    <g class="nudge">
      <path d="M0 0H14M9.5-4.5L14 0L9.5 4.5" fill="none" stroke="#67E8F9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
