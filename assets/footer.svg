<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-labelledby="title desc">
  <title id="title">Measured, grounded, deployable</title>
  <desc id="desc">Closing banner for the profile of Ali Ebrahimi, Senior Applied AI Engineer: measured, grounded, deployable, above an animated signal trace.</desc>

  <defs>
    <linearGradient id="topline" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset=".5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#FBBF24" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="wave" x1="28" y1="0" x2="1172" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity=".25"/>
      <stop offset=".5" stop-color="#8B5CF6" stop-opacity=".7"/>
      <stop offset="1" stop-color="#34D399" stop-opacity=".25"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="340" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 62) scale(1 .2)">
      <stop stop-color="#22D3EE" stop-opacity=".16"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#1E3A5F" fill-opacity=".7"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="120" rx="18"/></clipPath>
  </defs>

  <style><![CDATA[
    .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
    .led{transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out infinite}
    .s1{transform-box:fill-box;transform-origin:center;animation:beat 3s ease-in-out infinite}
    .s2{transform-box:fill-box;transform-origin:center;animation:beat 3s ease-in-out 1s infinite}
    .drift{animation:drift 14s linear infinite}
    @keyframes ping{0%{opacity:.7;transform:scale(1)}80%,100%{opacity:0;transform:scale(3)}}
    @keyframes beat{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.6)}}
    @keyframes drift{to{transform:translateX(24px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.fx{display:none}}
  ]]></style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="120" fill="#050D18"/>
    <g class="drift"><rect x="-24" width="1248" height="120" fill="url(#dots)"/></g>
    <rect width="1200" height="120" fill="url(#glow)"/>
    <rect width="1200" height="3" fill="url(#topline)"/>

    <!-- Status row -->
    <circle cx="38" cy="34" r="3" fill="#34D399"/>
    <circle class="led" cx="38" cy="34" r="3" fill="none" stroke="#34D399" stroke-width="1.2"/>
    <text class="mono" x="52" y="37.5" fill="#94A3B8" font-size="10.5" letter-spacing="1.4" textLength="104" lengthAdjust="spacing">SYSTEM ONLINE</text>
    <text class="mono" x="1172" y="37" text-anchor="end" fill="#64748B" font-size="10" letter-spacing=".8" textLength="318" lengthAdjust="spacing">ALI EBRAHIMI · SENIOR APPLIED AI ENGINEER</text>

    <!-- Tagline -->
    <g class="mono" font-size="16" font-weight="700" letter-spacing="4">
      <text x="397" y="68" fill="#67E8F9" textLength="109" lengthAdjust="spacing">MEASURED</text>
      <text x="532" y="68" fill="#C4B5FD" textLength="109" lengthAdjust="spacing">GROUNDED</text>
      <text x="667" y="68" fill="#6EE7B7" textLength="136" lengthAdjust="spacing">DEPLOYABLE</text>
    </g>
    <circle class="s1" cx="519" cy="62" r="2" fill="#475569"/>
    <circle class="s2" cx="654" cy="62" r="2" fill="#475569"/>

    <!-- Signal trace -->
    <path d="M28 102H180C230 102 240 90 290 90S350 102 400 102H470C520 102 530 88 580 88S640 102 690 102H760C810 102 820 90 870 90S930 102 980 102H1172" fill="none" stroke="url(#wave)" stroke-width="1.6" stroke-linecap="round"/>

    <g class="fx">
      <g fill="#67E8F9">
        <circle r="1.4" opacity=".18"><animateMotion dur="7s" repeatCount="indefinite" begin="0s" path="M28 102H180C230 102 240 90 290 90S350 102 400 102H470C520 102 530 88 580 88S640 102 690 102H760C810 102 820 90 870 90S930 102 980 102H1172"/></circle>
        <circle r="1.8" opacity=".35"><animateMotion dur="7s" repeatCount="indefinite" begin="-0.08s" path="M28 102H180C230 102 240 90 290 90S350 102 400 102H470C520 102 530 88 580 88S640 102 690 102H760C810 102 820 90 870 90S930 102 980 102H1172"/></circle>
        <circle r="2.2" opacity=".6"><animateMotion dur="7s" repeatCount="indefinite" begin="-0.16s" path="M28 102H180C230 102 240 90 290 90S350 102 400 102H470C520 102 530 88 580 88S640 102 690 102H760C810 102 820 90 870 90S930 102 980 102H1172"/></circle>
        <circle r="2.8" fill="#CFFAFE"><animateMotion dur="7s" repeatCount="indefinite" begin="-0.24s" path="M28 102H180C230 102 240 90 290 90S350 102 400 102H470C520 102 530 88 580 88S640 102 690 102H760C810 102 820 90 870 90S930 102 980 102H1172"/></circle>
      </g>
    </g>
  </g>

  <rect x=".75" y=".75" width="1198.5" height="118.5" rx="17.25" fill="none" stroke="#334155" stroke-width="1.5"/>
</svg>
