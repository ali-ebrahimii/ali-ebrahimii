<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Ali Ebrahimi — Applied AI Engineer</title>
  <desc id="desc">Editorial profile banner with bold typography and a restrained technical systems diagram.</desc>

  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#0f172a" opacity=".08"/>
    </pattern>
    <clipPath id="outer">
      <rect width="1200" height="300" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#outer)">
    <rect width="1200" height="300" fill="#fbfaf6"/>
    <rect x="744" width="456" height="300" fill="#f1f5f4"/>
    <rect x="744" width="456" height="300" fill="url(#dots)"/>
    <rect width="1200" height="5" fill="#06b6d4"/>

    <!-- Editorial identity -->
    <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
      <rect x="62" y="38" width="224" height="27" rx="4" fill="#06b6d4"/>
      <text x="174" y="57" text-anchor="middle" fill="#06202a" font-size="11" font-weight="800" letter-spacing="1.5">RESEARCH → SYSTEMS → IMPACT</text>

      <text x="60" y="130" fill="#0f172a" font-size="62" font-weight="800" letter-spacing="-2.2">ALI</text>
      <text x="60" y="191" fill="#0f172a" font-size="62" font-weight="800" letter-spacing="-2.2">EBRAHIMI</text>

      <rect x="62" y="217" width="24" height="3" fill="#06b6d4"/>
      <text x="99" y="223" fill="#1e293b" font-size="15" font-weight="750" letter-spacing=".85">APPLIED AI ENGINEER · PERSIAN NLP · TRUSTWORTHY AI</text>
      <text x="62" y="253" fill="#64748b" font-size="14" font-weight="600">PhD Researcher · University of Tehran</text>
    </g>

    <!-- Divider -->
    <line x1="744" y1="30" x2="744" y2="270" stroke="#cbd5e1"/>
    <circle cx="744" cy="60" r="4" fill="#06b6d4"/>
    <circle cx="744" cy="240" r="4" fill="#0f172a"/>

    <!-- Technical system -->
    <g transform="translate(774 24)">
      <text x="0" y="24" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="1.6">PERSIAN LANGUAGE INTELLIGENCE</text>

      <path d="M0 146C65 146 82 72 151 72S245 207 316 207 363 139 414 139" fill="none" stroke="#0e7490" stroke-width="2"/>
      <path d="M0 171C72 171 96 114 164 114S257 176 326 176 371 112 426 112" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 7"/>

      <g fill="#fbfaf6" stroke="#0f172a" stroke-width="1.5">
        <circle cx="40" cy="138" r="9"/>
        <circle cx="151" cy="72" r="11"/>
        <circle cx="226" cy="151" r="8"/>
        <circle cx="316" cy="207" r="11"/>
        <circle cx="401" cy="139" r="9"/>
      </g>
      <circle cx="151" cy="72" r="4" fill="#06b6d4"/>
      <circle cx="316" cy="207" r="4" fill="#06b6d4"/>
      <circle cx="40" cy="138" r="3" fill="#0f172a"/>
      <circle cx="226" cy="151" r="3" fill="#0f172a"/>
      <circle cx="401" cy="139" r="3" fill="#0f172a"/>

      <!-- Persian-inspired geometric rhythm -->
      <g transform="translate(286 56)" fill="none" stroke="#0f172a" opacity=".32">
        <path d="M0-26C9-15 15-9 26 0 15 9 9 15 0 26-9 15-15 9-26 0-15-9-9-15 0-26Z"/>
        <path d="M0-16C5-9 9-5 16 0 9 5 5 9 0 16-5 9-9 5-16 0-9-5-5-9 0-16Z"/>
      </g>

      <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" letter-spacing=".8">
        <text x="17" y="125" fill="#64748b">DATA</text>
        <text x="127" y="51" fill="#0e7490">RETRIEVE</text>
        <text x="198" y="139" fill="#64748b">EVALUATE</text>
        <text x="287" y="233" fill="#0e7490">GROUND</text>
        <text x="374" y="126" fill="#64748b">SERVE</text>
      </g>

      <line x1="0" y1="253" x2="426" y2="253" stroke="#cbd5e1"/>
      <text x="0" y="273" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="1.2">RELIABLE BY DESIGN</text>
      <text x="426" y="273" text-anchor="end" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">TEHRAN · IR</text>
    </g>
  </g>

  <rect x=".75" y=".75" width="1198.5" height="298.5" rx="21.25" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
</svg>