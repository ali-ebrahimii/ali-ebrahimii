<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-labelledby="title desc">
  <title id="title">Confidence-gated RAG architecture</title>
  <desc id="desc">Architecture of a Persian retrieval-augmented generation assistant. Offline ingestion: approved documents are extracted and normalized, chunked and embedded, and stored in a FAISS index that is rebuilt when documents change. Online serving: a user question sent to POST /answer passes through intent routing, synonym query expansion and dense retrieval into a trust gate that checks a minimum score and the top-1 to top-2 margin. Policy intents such as out-of-scope or medical advice return a fixed safe response. A passing gate produces a grounded answer generated by Qwen2.5 on vLLM. A failing gate triggers up to three retrieval passes (query, intent anchor, rewrite) and otherwise a transparent no-answer fallback. Responses use the contract Answer and status.</desc>

  <defs>
    <linearGradient id="topline" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6"/>
      <stop offset=".55" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#34D399" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="tintV" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8B5CF6" stop-opacity=".16"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></linearGradient>
    <linearGradient id="tintC" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#22D3EE" stop-opacity=".14"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></linearGradient>
    <linearGradient id="tintA" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FBBF24" stop-opacity=".15"/><stop offset="1" stop-color="#FBBF24" stop-opacity="0"/></linearGradient>
    <linearGradient id="tintR" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FB7185" stop-opacity=".15"/><stop offset="1" stop-color="#FB7185" stop-opacity="0"/></linearGradient>
    <linearGradient id="tintG" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#34D399" stop-opacity=".17"/><stop offset="1" stop-color="#34D399" stop-opacity="0"/></linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#94A3B8" fill-opacity=".1"/>
    </pattern>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="mV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1.5L9 5L1 8.5Z" fill="#A78BFA"/></marker>
    <marker id="mC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1.5L9 5L1 8.5Z" fill="#67E8F9"/></marker>
    <marker id="mA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1.5L9 5L1 8.5Z" fill="#FBBF24"/></marker>
    <marker id="mR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1.5L9 5L1 8.5Z" fill="#FB7185"/></marker>
    <marker id="mG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1.5L9 5L1 8.5Z" fill="#34D399"/></marker>
    <clipPath id="frame"><rect width="1000" height="410" rx="18"/></clipPath>
    <path id="pI" d="M116 100H692V190"/>
    <path id="pS" d="M116 215H884V297"/>
    <path id="pF" d="M116 215H884V282H500V297"/>
  </defs>

  <style><![CDATA[
    .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
    .flow{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:5 6;animation:flow 1.1s linear infinite}
    .gp{transform-box:fill-box;transform-origin:center;opacity:0;animation:gp 3.2s ease-out infinite}
    .led{animation:led 2.2s ease-in-out infinite}
    @keyframes flow{to{stroke-dashoffset:-11}}
    @keyframes gp{0%{opacity:.7;transform:scale(1)}70%,100%{opacity:0;transform:scale(1.4)}}
    @keyframes led{0%,100%{opacity:1}50%{opacity:.35}}
    @media (prefers-reduced-motion:reduce){.flow,.gp,.led{animation:none}.fx{display:none}}
  ]]></style>

  <g clip-path="url(#frame)">
    <rect width="1000" height="410" fill="#07111F"/>
    <rect width="1000" height="410" fill="url(#dots)"/>
    <rect width="1000" height="3" fill="url(#topline)"/>

    <!-- Header -->
    <text class="mono" x="38" y="29" fill="#67E8F9" font-size="10.5" font-weight="700" letter-spacing="1.6">SYSTEM.ARCHITECTURE</text>
    <text class="mono" x="962" y="29" text-anchor="end" fill="#64748B" font-size="10" letter-spacing=".5">Persian · FAISS · Qwen2.5 · vLLM · FastAPI</text>

    <!-- Lane labels -->
    <g class="mono" font-size="9.5">
      <circle cx="42" cy="54" r="3" fill="#A78BFA"/>
      <text x="52" y="58"><tspan fill="#C4B5FD" font-weight="700" letter-spacing="1.2">A · INGEST</tspan><tspan fill="#64748B" dx="12" letter-spacing=".3">offline · rebuildable</tspan></text>
      <circle cx="42" cy="169" r="3" fill="#22D3EE"/>
      <text x="52" y="173"><tspan fill="#67E8F9" font-weight="700" letter-spacing="1.2">B · SERVE</tspan><tspan fill="#64748B" dx="12" letter-spacing=".3">online · per request</tspan></text>
      <circle cx="42" cy="286" r="3" fill="#34D399"/>
      <text x="52" y="290"><tspan fill="#6EE7B7" font-weight="700" letter-spacing="1.2">C · RESPOND</tspan><tspan fill="#64748B" dx="12" letter-spacing=".3">evidence or fallback</tspan></text>
    </g>

    <!-- Connectors -->
    <g>
      <path class="flow" d="M198 100H227" stroke="#A78BFA" marker-end="url(#mV)"/>
      <path class="flow" d="M390 100H419" stroke="#A78BFA" marker-end="url(#mV)"/>
      <path class="flow" d="M582 100H611" stroke="#A78BFA" marker-end="url(#mV)"/>
      <path class="flow" d="M692 136V180" stroke="#A78BFA" marker-end="url(#mV)"/>

      <path class="flow" d="M198 215H227" stroke="#67E8F9" marker-end="url(#mC)"/>
      <path class="flow" d="M390 215H419" stroke="#67E8F9" marker-end="url(#mC)"/>
      <path class="flow" d="M582 215H611" stroke="#67E8F9" marker-end="url(#mC)"/>
      <path class="flow" d="M774 215H799" stroke="#67E8F9" marker-end="url(#mC)"/>

      <path class="flow" d="M308 250V297" stroke="#FBBF24" marker-end="url(#mA)"/>
      <path class="flow" d="M884 257V282" stroke="#67E8F9"/>
      <path class="flow" d="M884 282V297" stroke="#34D399" marker-end="url(#mG)"/>
      <path class="flow" d="M884 282H500V297" stroke="#FB7185" marker-end="url(#mR)"/>
    </g>

    <!-- Data packets, drawn beneath the nodes so they surface only between them -->
    <g class="fx">
      <circle r="3.6" fill="#EDE9FE" opacity="0" filter="url(#glow)">
        <animateMotion dur="5.5s" begin="0s" repeatCount="indefinite"><mpath href="#pI"/></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.04;.94;1" dur="5.5s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <circle r="2.5" fill="#A78BFA" opacity="0">
        <animateMotion dur="5.5s" begin=".14s" repeatCount="indefinite"><mpath href="#pI"/></animateMotion>
        <animate attributeName="opacity" values="0;.75;.75;0" keyTimes="0;.04;.94;1" dur="5.5s" begin=".14s" repeatCount="indefinite"/>
      </circle>

      <circle r="3.6" fill="#ECFEFF" opacity="0" filter="url(#glow)">
        <animateMotion dur="7s" begin=".6s" repeatCount="indefinite"><mpath href="#pS"/></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.04;.94;1" dur="7s" begin=".6s" repeatCount="indefinite"/>
      </circle>
      <circle r="2.5" fill="#67E8F9" opacity="0">
        <animateMotion dur="7s" begin=".74s" repeatCount="indefinite"><mpath href="#pS"/></animateMotion>
        <animate attributeName="opacity" values="0;.75;.75;0" keyTimes="0;.04;.94;1" dur="7s" begin=".74s" repeatCount="indefinite"/>
      </circle>

      <circle r="3.6" fill="#FFF1F2" opacity="0" filter="url(#glow)">
        <animateMotion dur="10.2s" begin="4.2s" repeatCount="indefinite"><mpath href="#pF"/></animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.03;.95;1" dur="10.2s" begin="4.2s" repeatCount="indefinite"/>
      </circle>
      <circle r="2.5" fill="#FB7185" opacity="0">
        <animateMotion dur="10.2s" begin="4.34s" repeatCount="indefinite"><mpath href="#pF"/></animateMotion>
        <animate attributeName="opacity" values="0;.75;.75;0" keyTimes="0;.03;.95;1" dur="10.2s" begin="4.34s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- A · Ingest -->
    <g transform="translate(38 68)">
      <rect width="156" height="64" rx="12" fill="#0A1628"/><rect width="156" height="64" rx="12" fill="url(#tintV)"/>
      <rect x=".6" y=".6" width="154.8" height="62.8" rx="11.4" fill="none" stroke="#8B5CF6" stroke-opacity=".6" stroke-width="1.2"/>
      <text class="mono" x="144" y="19" text-anchor="end" font-size="9" font-weight="700" fill="#A78BFA">A1</text>
      <text class="sans" x="14" y="29" font-size="13.5" font-weight="720" fill="#F8FAFC">Approved docs</text>
      <text class="mono" x="14" y="47" font-size="9.5" fill="#94A3B8" textLength="91.2" lengthAdjust="spacing">.docx · approved</text>
    </g>
    <g transform="translate(230 68)">
      <rect width="156" height="64" rx="12" fill="#0A1628"/><rect width="156" height="64" rx="12" fill="url(#tintV)"/>
      <rect x=".6" y=".6" width="154.8" height="62.8" rx="11.4" fill="none" stroke="#8B5CF6" stroke-opacity=".6" stroke-width="1.2"/>
      <text class="mono" x="144" y="19" text-anchor="end" font-size="9" font-weight="700" fill="#A78BFA">A2</text>
      <text class="sans" x="14" y="29" font-size="13.5" font-weight="720" fill="#F8FAFC">Extract · clean</text>
      <text class="mono" x="14" y="47" font-size="9.5" fill="#94A3B8" textLength="119.7" lengthAdjust="spacing">Persian normalization</text>
    </g>
    <g transform="translate(422 68)">
      <rect width="156" height="64" rx="12" fill="#0A1628"/><rect width="156" height="64" rx="12" fill="url(#tintV)"/>
      <rect x=".6" y=".6" width="154.8" height="62.8" rx="11.4" fill="none" stroke="#8B5CF6" stroke-opacity=".6" stroke-width="1.2"/>
      <text class="mono" x="144" y="19" text-anchor="end" font-size="9" font-weight="700" fill="#A78BFA">A3</text>
      <text class="sans" x="14" y="29" font-size="13.5" font-weight="720" fill="#F8FAFC">Chunk · embed</text>
      <text class="mono" x="14" y="47" font-size="9.5" fill="#94A3B8" textLength="114" lengthAdjust="spacing">350 tok · 80 overlap</text>
    </g>
    <g transform="translate(614 68)">
      <rect width="156" height="64" rx="12" fill="#0A1628"/><rect width="156" height="64" rx="12" fill="url(#tintV)"/>
      <rect x=".6" y=".6" width="154.8" height="62.8" rx="11.4" fill="none" stroke="#8B5CF6" stroke-opacity=".6" stroke-width="1.2"/>
      <text class="mono" x="144" y="19" text-anchor="end" font-size="9" font-weight="700" fill="#A78BFA">A4</text>
      <text class="sans" x="14" y="29" font-size="13.5" font-weight="720" fill="#F8FAFC">FAISS index</text>
      <text class="mono" x="14" y="47" font-size="9.5" fill="#94A3B8" textLength="96.9" lengthAdjust="spacing">chunks + metadata</text>
    </g>
    <g transform="translate(806 68)">
      <rect width="156" height="64" rx="12" fill="#07111F" stroke="#475569" stroke-width="1.2" stroke-dasharray="4 4"/>
      <text class="sans" x="14" y="29" font-size="13.5" font-weight="720" fill="#94A3B8">↻ Rebuild</text>
      <text class="mono" x="14" y="47" font-size="9.5" fill="#64748B" textLength="102.6" lengthAdjust="spacing">on document change</text>
    </g>

    <!-- B · Serve -->
    <g transform="translate(38 183)">
      <rect width="156" height="64" rx="12" fill="#0A1628"/><rect width="156" height="64" rx="12" fill="url(#tintC)"/>
      <rect x=".6" y=".6" width="154.8" height="62.8" rx="11.4" fill="none" stroke="#22D3EE" stroke-opacity=".6" stroke-width="1.2"/>
      <text class="mono" x="144" y="19" text-anchor="end" font-size="9" font-weight="700" fill="#67E8F9">B1</text>
      <text class="sans" x="14" y="29" font-size="13.5" font-weight="720" fill="#F8FAFC">User question</text>
      <text class="mono" x="14" y="47" font-size="9.5" fill="#94A3B8" textLength="68.4" lengthAdjust="spacing">POST /answer</text>
    </g>
    <g transform="translate(230 183)">
      <rect width="156" height="64" rx="12" fill="#0A1628"/><rect width="156" height="64" rx="12" fill="url(#tintC)"/>
      <rect x=".6" y=".6" width="154.8" height="62.8" rx="11.4" fill="none" stroke="#22D3EE" stroke-opacity=".6" stroke-width="1.2"/>
      <text class="mono" x="144" y="19" text-anchor="end" font-size="9" font-weight="700" fill="#67E8F9">B2</text>
      <text class="sans" x="14" y="29" font-size="13.5" font-weight="720" fill="#F8FAFC">Intent routing</text>
      <text class="mono" x="14" y="47" font-size="9.5" fill="#94A3B8" textLength="114" lengthAdjust="spacing">rule-based · Persian</text>
    </g>
    <g transform="translate(422 183)">
      <rect width="156" height="64" rx="12" fill="#0A1628"/><rect width="156" height="64" rx="12" fill="url(#tintC)"/>
      <rect x=".6" y=".6" width="154.8" height="62.8" rx="11.4" fill="none" stroke="#22D3EE" stroke-opacity=".6" stroke-width="1.2"/>
      <text class="mono" x="144" y="19" text-anchor="end" font-size="9" font-weight="700" fill="#67E8F9">B3</text>
      <text class="sans" x="14" y="29" font-size="13.5" font-weight="720" fill="#F8FAFC">Query expansion</text>
      <text class="mono" x="14" y="47" font-size="9.5" fill="#94A3B8" textLength="119.7" lengthAdjust="spacing">intent-aware synonyms</text>
    </g>
    <g transform="translate(614 183)">
      <rect width="156" height="64" rx="12" fill="#0A1628"/><rect width="156" height="64" rx="12" fill="url(#tintC)"/>
      <rect x=".6" y=".6" width="154.8" height="62.8" rx="11.4" fill="none" stroke="#22D3EE" stroke-opacity=".6" stroke-width="1.2"/>
      <text class="mono" x="144" y="19" text-anchor="end" font-size="9" font-weight="700" fill="#67E8F9">B4</text>
      <text class="sans" x="14" y="29" font-size="13.5" font-weight="720" fill="#F8FAFC">Dense retrieval</text>
      <text class="mono" x="14" y="47" font-size="9.5" fill="#94A3B8" textLength="85.5" lengthAdjust="spacing">top-k 6 · dense</text>
    </g>

    <!-- Trust gate -->
    <path d="M884 175L966 215L884 255L802 215Z" fill="#0A1628"/>
    <path d="M884 175L966 215L884 255L802 215Z" fill="#22D3EE" fill-opacity=".08"/>
    <path class="gp fx" d="M884 175L966 215L884 255L802 215Z" fill="none" stroke="#22D3EE" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M884 175L966 215L884 255L802 215Z" fill="none" stroke="#22D3EE" stroke-opacity=".85" stroke-width="1.4" stroke-linejoin="round"/>
    <text class="mono" x="884" y="212" text-anchor="middle" font-size="10.5" font-weight="700" fill="#F8FAFC" letter-spacing=".8">TRUST GATE</text>
    <text class="mono" x="884" y="226" text-anchor="middle" font-size="9" fill="#94A3B8" textLength="76" lengthAdjust="spacing">score + margin</text>
    <circle cx="884" cy="282" r="3" fill="#E2E8F0"/>
    <text class="mono" x="896" y="287" font-size="9.5" font-weight="700" fill="#34D399" letter-spacing=".8">PASS</text>
    <text class="mono" x="846" y="277" text-anchor="middle" font-size="9.5" font-weight="700" fill="#FB7185" letter-spacing=".8">FAIL</text>

    <!-- C · Respond -->
    <g transform="translate(38 300)">
      <rect width="156" height="64" rx="12" fill="#07111F" stroke="#475569" stroke-width="1.2" stroke-dasharray="4 4"/>
      <text class="sans" x="14" y="29" font-size="13.5" font-weight="720" fill="#CBD5E1">API contract</text>
      <text class="mono" x="14" y="47" font-size="9.5" fill="#94A3B8" textLength="102.6" lengthAdjust="spacing">{ Answer, status }</text>
    </g>
    <g transform="translate(230 300)">
      <rect width="156" height="64" rx="12" fill="#0A1628"/><rect width="156" height="64" rx="12" fill="url(#tintA)"/>
      <rect x=".6" y=".6" width="154.8" height="62.8" rx="11.4" fill="none" stroke="#FBBF24" stroke-opacity=".6" stroke-width="1.2"/>
      <text class="mono" x="144" y="19" text-anchor="end" font-size="9" font-weight="700" fill="#FCD34D">C1</text>
      <text class="sans" x="14" y="29" font-size="13.5" font-weight="720" fill="#F8FAFC">Policy fallback</text>
      <text class="mono" x="14" y="47" font-size="9.5" fill="#94A3B8" textLength="125.4" lengthAdjust="spacing">out-of-scope · medical</text>
    </g>
    <g transform="translate(422 300)">
      <rect width="156" height="64" rx="12" fill="#0A1628"/><rect width="156" height="64" rx="12" fill="url(#tintR)"/>
      <rect x=".6" y=".6" width="154.8" height="62.8" rx="11.4" fill="none" stroke="#FB7185" stroke-opacity=".6" stroke-width="1.2"/>
      <text class="mono" x="144" y="19" text-anchor="end" font-size="9" font-weight="700" fill="#FDA4AF">C2</text>
      <text class="sans" x="14" y="29" font-size="13.5" font-weight="720" fill="#F8FAFC">Safe fallback</text>
      <text class="mono" x="14" y="47" font-size="9.5" fill="#94A3B8" textLength="119.7" lengthAdjust="spacing">transparent no-answer</text>
    </g>
    <g transform="translate(614 300)">
      <rect width="156" height="64" rx="12" fill="#07111F" stroke="#475569" stroke-width="1.2" stroke-dasharray="4 4"/>
      <text class="mono" x="14" y="23" font-size="9.5" font-weight="700" fill="#FCD34D" textLength="102.6" lengthAdjust="spacing">3 RETRIEVAL PASSES</text>
      <text class="mono" x="14" y="39" font-size="9.5" fill="#CBD5E1" textLength="114" lengthAdjust="spacing">query→anchor→rewrite</text>
      <text class="mono" x="14" y="53" font-size="9.5" fill="#64748B" textLength="102.6" lengthAdjust="spacing">then safe fallback</text>
    </g>
    <g transform="translate(806 300)">
      <rect width="156" height="64" rx="12" fill="#0A1628"/><rect width="156" height="64" rx="12" fill="url(#tintG)"/>
      <rect x=".6" y=".6" width="154.8" height="62.8" rx="11.4" fill="none" stroke="#34D399" stroke-opacity=".7" stroke-width="1.2"/>
      <circle class="led" cx="137" cy="16" r="3" fill="#34D399"/>
      <text class="sans" x="14" y="29" font-size="13.5" font-weight="720" fill="#F8FAFC">Grounded answer</text>
      <text class="mono" x="14" y="47" font-size="9.5" fill="#94A3B8" textLength="79.8" lengthAdjust="spacing">Qwen2.5 · vLLM</text>
    </g>

    <!-- Principle -->
    <path d="M38 380H962" stroke="#1E293B"/>
    <text class="mono" x="500" y="398" text-anchor="middle" font-size="10.5" letter-spacing=".4" textLength="640" lengthAdjust="spacing"><tspan fill="#94A3B8">EVERY PASS GATED BY MINIMUM SCORE + TOP-1/TOP-2 MARGIN — </tspan><tspan fill="#A7F3D0" font-weight="700">EVIDENCE OR FALLBACK, NEVER A GUESS</tspan></text>
  </g>

  <rect x=".75" y=".75" width="998.5" height="408.5" rx="17.25" fill="none" stroke="#334155" stroke-width="1.5"/>
</svg>
