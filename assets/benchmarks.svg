<svg xmlns="http://www.w3.org/2000/svg" width="900" height="352" viewBox="0 0 900 352" role="img" aria-labelledby="title desc">
  <title id="title">Open-weight LLMs on Persian tasks</title>
  <desc id="desc">Zero-shot results with Persian prompts and 4-bit quantization. ParsiNLU entailment accuracy: Qwen2.5-14B 62.69 percent, Qwen2.5-7B 61.19 percent, Llama-3.1-8B 53.76 percent. Khayyam reasoning accuracy: Qwen2.5-14B 43.00 percent, Qwen2.5-7B 36.44 percent, Llama-3.1-8B 28.50 percent, against a 25 percent random baseline and a 50 percent GPT-4 reference. The sentiment task is excluded because every model scored 11 to 17 percent, near chance.</desc>

  <defs>
    <linearGradient id="topline" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6"/>
      <stop offset=".55" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="gCyan" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <linearGradient id="gViolet" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
    <linearGradient id="gSlate" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#475569"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
    <filter id="barglow" x="-10%" y="-150%" width="120%" height="400%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="900" height="352" rx="18"/></clipPath>
  </defs>

  <style><![CDATA[
    .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
    .bar{transform-box:fill-box;transform-origin:0 50%;animation:grow 1.1s cubic-bezier(.22,1,.36,1) both}
    .cap{animation:slide 1.1s cubic-bezier(.22,1,.36,1) both}
    .val{animation:fade .5s ease-out both}
    .ring{opacity:0;transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out 1.7s infinite}
    .r1{animation-delay:.25s}.r2{animation-delay:.39s}.r3{animation-delay:.53s}
    .v1{animation-delay:1.1s}.v2{animation-delay:1.24s}.v3{animation-delay:1.38s}
    @keyframes grow{from{transform:scaleX(0)}}
    @keyframes slide{from{transform:translateX(0)}}
    @keyframes fade{from{opacity:0}}
    @keyframes ring{0%{opacity:.85;transform:scale(1)}70%,100%{opacity:0;transform:scale(3.6)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  ]]></style>

  <g clip-path="url(#frame)">
    <rect width="900" height="352" fill="#07111F"/>
    <rect width="900" height="3" fill="url(#topline)"/>

    <!-- Header -->
    <text class="mono" x="28" y="33" fill="#67E8F9" font-size="10.5" font-weight="700" letter-spacing="1.6">BENCHMARK.EVAL</text>
    <text class="sans" x="28" y="59" fill="#F8FAFC" font-size="20" font-weight="760">Open-weight LLMs on Persian tasks</text>
    <g class="mono" font-size="10" font-weight="700" fill="#94A3B8" text-anchor="middle" letter-spacing=".6">
      <rect x="602" y="20" width="74" height="22" rx="11" fill="#0B1B30" stroke="#334155"/>
      <text x="639" y="35">ZERO-SHOT</text>
      <rect x="684" y="20" width="110" height="22" rx="11" fill="#0B1B30" stroke="#334155"/>
      <text x="739" y="35">PERSIAN PROMPTS</text>
      <rect x="802" y="20" width="74" height="22" rx="11" fill="#0B1B30" stroke="#334155"/>
      <text x="839" y="35">4-BIT NF4</text>
    </g>

    <!-- Panel A · ParsiNLU entailment -->
    <rect x="24" y="76" width="412" height="212" rx="14" fill="#0A1628" stroke="#1E293B"/>
    <rect x="42" y="91" width="3" height="14" rx="1.5" fill="#22D3EE"/>
    <text class="mono" x="54" y="102" fill="#E2E8F0" font-size="11" font-weight="700" letter-spacing=".9">PARSINLU · ENTAILMENT</text>
    <text class="mono" x="418" y="102" text-anchor="end" fill="#64748B" font-size="10" letter-spacing=".6">ACCURACY %</text>

    <g transform="translate(140 0)" stroke="#1E293B">
      <path d="M53.5 134V236M107 134V236M160.5 134V236"/>
      <path d="M0 236H214" stroke="#334155"/>
      <path d="M0 236V240M53.5 236V240M107 236V240M160.5 236V240M214 236V240" stroke="#334155"/>
    </g>
    <g class="mono" font-size="9" fill="#64748B" text-anchor="middle">
      <text x="140" y="252">0</text><text x="247" y="252">50</text><text x="354" y="252">100</text>
    </g>

    <g class="mono" font-size="11.5" fill="#CBD5E1">
      <text x="42" y="152">Qwen2.5-14B</text>
      <text x="42" y="188">Qwen2.5-7B</text>
      <text x="42" y="224">Llama-3.1-8B</text>
    </g>
    <g transform="translate(140 148)">
      <rect x="0" y="-5" width="214" height="10" rx="5" fill="#1E293B"/>
      <rect class="bar r1" x="0" y="-5" width="134.2" height="10" rx="5" fill="url(#gCyan)" filter="url(#barglow)"/>
      <g class="cap r1" style="transform:translateX(129px)"><circle class="ring" r="3.5" fill="none" stroke="#67E8F9" stroke-width="1.5"/><circle r="3" fill="#ECFEFF"/></g>
    </g>
    <g transform="translate(140 184)">
      <rect x="0" y="-5" width="214" height="10" rx="5" fill="#1E293B"/>
      <rect class="bar r2" x="0" y="-5" width="131" height="10" rx="5" fill="url(#gViolet)"/>
      <g class="cap r2" style="transform:translateX(126px)"><circle r="3" fill="#F5F3FF"/></g>
    </g>
    <g transform="translate(140 220)">
      <rect x="0" y="-5" width="214" height="10" rx="5" fill="#1E293B"/>
      <rect class="bar r3" x="0" y="-5" width="115" height="10" rx="5" fill="url(#gSlate)"/>
      <g class="cap r3" style="transform:translateX(110px)"><circle r="3" fill="#E2E8F0"/></g>
    </g>
    <g class="mono" font-size="13" font-weight="700">
      <text class="val v1" x="364" y="152.5" fill="#A5F3FC">62.69%</text>
      <text class="val v2" x="364" y="188.5" fill="#DDD6FE">61.19%</text>
      <text class="val v3" x="364" y="224.5" fill="#CBD5E1">53.76%</text>
    </g>
    <circle cx="44" cy="268" r="3" fill="#22D3EE"/>
    <text class="sans" x="54" y="272" fill="#CBD5E1" font-size="12.5" font-weight="600">Qwen2.5-7B lands within 1.5 pts of the 14B model.</text>

    <!-- Panel B · Khayyam reasoning -->
    <rect x="464" y="76" width="412" height="212" rx="14" fill="#0A1628" stroke="#1E293B"/>
    <rect x="482" y="91" width="3" height="14" rx="1.5" fill="#8B5CF6"/>
    <text class="mono" x="494" y="102" fill="#E2E8F0" font-size="11" font-weight="700" letter-spacing=".9">KHAYYAM · REASONING</text>
    <text class="mono" x="858" y="102" text-anchor="end" fill="#64748B" font-size="10" letter-spacing=".6">ACCURACY %</text>

    <g transform="translate(580 0)" stroke="#1E293B">
      <path d="M53.5 134V236M107 134V236M160.5 134V236"/>
      <path d="M0 236H214" stroke="#334155"/>
      <path d="M0 236V240M53.5 236V240M107 236V240M160.5 236V240M214 236V240" stroke="#334155"/>
    </g>
    <g class="mono" font-size="9" fill="#64748B" text-anchor="middle">
      <text x="580" y="252">0</text><text x="687" y="252">50</text><text x="794" y="252">100</text>
    </g>

    <g class="mono" font-size="11.5" fill="#CBD5E1">
      <text x="482" y="152">Qwen2.5-14B</text>
      <text x="482" y="188">Qwen2.5-7B</text>
      <text x="482" y="224">Llama-3.1-8B</text>
    </g>
    <g transform="translate(580 148)">
      <rect x="0" y="-5" width="214" height="10" rx="5" fill="#1E293B"/>
      <rect class="bar r1" x="0" y="-5" width="92" height="10" rx="5" fill="url(#gCyan)" filter="url(#barglow)"/>
      <g class="cap r1" style="transform:translateX(87px)"><circle class="ring" r="3.5" fill="none" stroke="#67E8F9" stroke-width="1.5"/><circle r="3" fill="#ECFEFF"/></g>
    </g>
    <g transform="translate(580 184)">
      <rect x="0" y="-5" width="214" height="10" rx="5" fill="#1E293B"/>
      <rect class="bar r2" x="0" y="-5" width="78" height="10" rx="5" fill="url(#gViolet)"/>
      <g class="cap r2" style="transform:translateX(73px)"><circle r="3" fill="#F5F3FF"/></g>
    </g>
    <g transform="translate(580 220)">
      <rect x="0" y="-5" width="214" height="10" rx="5" fill="#1E293B"/>
      <rect class="bar r3" x="0" y="-5" width="61" height="10" rx="5" fill="url(#gSlate)"/>
      <g class="cap r3" style="transform:translateX(56px)"><circle r="3" fill="#E2E8F0"/></g>
    </g>

    <!-- Reference lines -->
    <path d="M633.5 132V238" stroke="#FB7185" stroke-opacity=".85" stroke-dasharray="3 3"/>
    <path d="M687 132V238" stroke="#FBBF24" stroke-opacity=".85" stroke-dasharray="3 3"/>
    <g class="mono" font-size="9" font-weight="700" text-anchor="middle">
      <text x="633.5" y="127" fill="#FB7185">RANDOM 25</text>
      <text x="689" y="127" fill="#FBBF24">GPT-4 50</text>
    </g>

    <g class="mono" font-size="13" font-weight="700">
      <text class="val v1" x="804" y="152.5" fill="#A5F3FC">43.00%</text>
      <text class="val v2" x="804" y="188.5" fill="#DDD6FE">36.44%</text>
      <text class="val v3" x="804" y="224.5" fill="#CBD5E1">28.50%</text>
    </g>
    <circle cx="484" cy="268" r="3" fill="#8B5CF6"/>
    <text class="sans" x="494" y="272" fill="#CBD5E1" font-size="12.5" font-weight="600">14B leads by 6.6 pts; every model clears 25% chance.</text>

    <!-- Footer -->
    <path d="M28 304H872" stroke="#1E293B"/>
    <text class="mono" x="28" y="327" fill="#64748B" font-size="10">SENTIMENT EXCLUDED · ALL MODELS 11–17%, NEAR CHANCE (~14%)</text>
    <text class="mono" x="872" y="327" text-anchor="end" fill="#64748B" font-size="10">REFERENCES · KHAYYAM LEADERBOARD, AS RECORDED IN THE REPO README</text>
  </g>

  <rect x=".75" y=".75" width="898.5" height="350.5" rx="17.25" fill="none" stroke="#334155" stroke-width="1.5"/>
</svg>
